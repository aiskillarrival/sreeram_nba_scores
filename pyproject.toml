[project]
name = "nba-scores"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andy Miles", email = "andy@arrivingskills.ai" }
]
requires-python = ">=3.13"
dependencies = [
    "nba-api>=1.11.4",
